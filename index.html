
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZRX SHOP - Purple Neon</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --purple: #a855f7;
  --light: #d8b4fe;
  --pink: #e879f9;
  --bg: #080510;
  --card: #160d25;
}

body {
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at top, #321052 0%, transparent 48%),
    var(--bg);
  color: #fff;
  padding: 16px;
  min-height: 100vh;
}

.container {
  max-width: 560px;
  margin: auto;
}

header {
  text-align: center;
  padding: 28px 10px 25px;
  border-bottom: 1px solid #512477;
}

.logo {
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--light);
  text-shadow: 0 0 10px #a855f7, 0 0 25px #9333ea;
}

.tagline {
  color: #ddd0ed;
  margin-top: 12px;
  font-size: 15px;
}

.subtag {
  color: #b78ad8;
  margin-top: 8px;
  font-size: 13px;
}

.section-title {
  color: var(--light);
  text-align: center;
  margin: 27px 0 18px;
  font-size: 21px;
  text-shadow: 0 0 12px #9333ea;
}

.packages {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 13px;
}

.package {
  width: 100%;
  background: linear-gradient(145deg, #241137, #10091b);
  border: 1px solid #7135a5;
  border-radius: 14px;
  padding: 19px 8px;
  text-align: center;
  color: white;
  cursor: pointer;
  transition: .2s;
  box-shadow: 0 0 10px #7e22ce22;
}

.package:hover,
.package.selected {
  border: 2px solid #d8b4fe;
  background: linear-gradient(145deg, #55217c, #261039);
  box-shadow: 0 0 12px #a855f7, 0 0 25px #9333ea55;
  transform: translateY(-2px);
}

.diamond {
  display: block;
  font-size: 28px;
  margin-bottom: 9px;
  filter: drop-shadow(0 0 7px #38bdf8);
}

.package strong {
  display: block;
  font-size: 21px;
}

.package span {
  display: block;
  margin-top: 8px;
  color: #e9a8ff;
  font-size: 18px;
  font-weight: bold;
}

.package small {
  display: block;
  color: #bda8d0;
  margin-top: 7px;
  font-size: 11px;
}

.form-box {
  background: linear-gradient(145deg, #21112f, #11091c);
  border: 1px solid #8139b7;
  border-radius: 17px;
  padding: 20px;
  margin-top: 27px;
  box-shadow: 0 0 18px #9333ea33;
}

.form-box h2 {
  color: var(--light);
  text-align: center;
  font-size: 21px;
  margin-bottom: 17px;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #e7d4f7;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #71439a;
  border-radius: 9px;
  background: #0c0713;
  color: white;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #d8b4fe;
  box-shadow: 0 0 10px #a855f766;
}

input::placeholder {
  color: #89799b;
}

input[readonly] {
  color: #e9b5ff;
  background: #1b1028;
}

#lookupStatus {
  margin-top: 9px;
  font-size: 13px;
  line-height: 1.6;
  color: #c4a5fd;
}

#lookupStatus.success {
  color: #86efac;
}

#lookupStatus.error {
  color: #fca5a5;
}

#lookupStatus.loading {
  color: #f0abfc;
}

button.order-btn {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  border: 1px solid #d8b4fe;
  border-radius: 10px;
  background: linear-gradient(90deg, #7e22ce, #a855f7, #c026d3);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 15px #9333ea66;
  transition: .2s;
}

button.order-btn:hover {
  box-shadow: 0 0 22px #c084fc;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

#result {
  display: none;
  background: #1b1028;
  border: 1px solid #a855f7;
  padding: 14px;
  border-radius: 10px;
  margin-top: 17px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.notice {
  margin-top: 22px;
  padding: 14px;
  background: #30200e;
  border: 1px solid #a66b23;
  color: #ffd58a;
  border-radius: 10px;
  font-size: 13px;
  line-height: 1.7;
  text-align: center;
}

footer {
  text-align: center;
  color: #927fa4;
  margin: 27px 0 12px;
  font-size: 12px;
}

@media (max-width: 360px) {
  .logo {
    font-size: 31px;
  }

  .package {
    padding: 15px 5px;
  }

  .package strong {
    font-size: 18px;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="logo">ZRX SHOP</div>
  <p class="tagline">Free Fire Diamond Store</p>
  <p class="subtag">তোমার পছন্দের Diamond Package বেছে নাও</p>
</header>

<h2 class="section-title">💎 Diamond Packages 💎</h2>

<div class="packages">

  <button type="button" class="package"
    onclick="selectPackage(100,80,this)">
    <span class="diamond">💎</span>
    <strong>100 Diamonds</strong>
    <span>৳80</span>
    <small>ডেমো প্যাকেজ</small>
  </button>

  <button type="button" class="package"
    onclick="selectPackage(200,150,this)">
    <span class="diamond">💎</span>
    <strong>200 Diamonds</strong>
    <span>৳150</span>
    <small>ডেমো প্যাকেজ</small>
  </button>

  <button type="button" class="package"
    onclick="selectPackage(310,240,this)">
    <span class="diamond">💎</span>
    <strong>310 Diamonds</strong>
    <span>৳240</span>
    <small>ডেমো প্যাকেজ</small>
  </button>

  <button type="button" class="package"
    onclick="selectPackage(520,350,this)">
    <span class="diamond">💎</span>
    <strong>520 Diamonds</strong>
    <span>৳350</span>
    <small>ডেমো প্যাকেজ</small>
  </button>

  <button type="button" class="package"
    onclick="selectPackage(1060,720,this)">
    <span class="diamond">💎</span>
    <strong>1060 Diamonds</strong>
    <span>৳720</span>
    <small>ডেমো প্যাকেজ</small>
  </button>

  <button type="button" class="package"
    onclick="selectPackage(2180,1450,this)">
    <span class="diamond">💎</span>
    <strong>2180 Diamonds</strong>
    <span>৳1450</span>
    <small>ডেমো প্যাকেজ</small>
  </button>

</div>

<div class="form-box">

  <h2>🛒 Demo Order</h2>

  <label>Free Fire Player UID</label>
  <input
    id="uid"
    type="text"
    inputmode="numeric"
    maxlength="15"
    autocomplete="off"
    placeholder="তোমার Player UID লিখো"
  >

  <div id="lookupStatus" aria-live="polite">
    UID লিখলে Player Name খোঁজা হবে।
  </div>

  <label>Player Name</label>
  <input
    id="playerName"
    type="text"
    maxlength="50"
    placeholder="Player Name এখানে দেখাবে"
    readonly
  >

  <label>Selected Package</label>
  <input
    id="selected"
    type="text"
    placeholder="আগে একটি Package বেছে নাও"
    readonly
  >

  <button
    type="button"
    class="order-btn"
    id="orderButton"
    onclick="placeOrder()">
    ডেমো অর্ডার তৈরি করো
  </button>

  <div id="result" aria-live="polite"></div>

</div>

<div class="notice">
  ⚠️ এটি একটি পরীক্ষামূলক Demo Website।
  এখানে কোনো আসল Payment বা Diamond Delivery হয় না।
  কোনো টাকা পাঠাবে না।
</div>

<footer>
  © 2026 ZRX SHOP | All Rights Reserved
</footer>

</div>

<script>
let selectedPackage = 0;
let selectedPrice = 0;

let lookupTimer = null;
let lookupController = null;
let lookupNumber = 0;

const uidInput = document.getElementById("uid");
const playerNameInput = document.getElementById("playerName");
const lookupStatus = document.getElementById("lookupStatus");

function setLookupStatus(message, type = "") {
  lookupStatus.textContent = message;
  lookupStatus.className = type;
}

function selectPackage(amount, price, element) {
  selectedPackage = amount;
  selectedPrice = price;

  document.querySelectorAll(".package").forEach(function(item) {
    item.classList.remove("selected");
  });

  element.classList.add("selected");

  document.getElementById("selected").value =
    amount + " Diamonds — ৳" + price;
}

// UID পরিবর্তন হলে আগের ফলাফল বাতিল করে নতুন Lookup
uidInput.addEventListener("input", function() {
  clearTimeout(lookupTimer);

  lookupNumber++;

  if (lookupController) {
    lookupController.abort();
    lookupController = null;
  }

  playerNameInput.value = "";

  const uid = uidInput.value.trim();

  if (!/^\d{5,15}$/.test(uid)) {
    setLookupStatus(
      uid.length === 0
        ? "UID লিখলে Player Name খোঁজা হবে।"
        : "৫ থেকে ১৫ সংখ্যার সঠিক UID লিখুন।"
    );
    return;
  }

  setLookupStatus("Player Name খোঁজা হচ্ছে...", "loading");

  const currentLookup = lookupNumber;

  lookupTimer = setTimeout(function() {
    lookupPlayer(uid, currentLookup);
  }, 700);
});

async function lookupPlayer(uid, currentLookup) {
  lookupController = new AbortController();

  try {
    const response = await fetch(
      "/api/player?uid=" + encodeURIComponent(uid),
      {
        method: "GET",
        cache: "no-store",
        signal: lookupController.signal
      }
    );

    const data = await response.json();

    if (currentLookup !== lookupNumber) return;

    if (!response.ok || !data.success || !data.nickname) {
      throw new Error(
        data.message || "Player Name পাওয়া যায়নি।"
      );
    }

    playerNameInput.value = data.nickname;

    setLookupStatus(
      data.cached
        ? "✅ Player Name ডেটাবেজ থেকে পাওয়া গেছে।"
        : "✅ Player Name পাওয়া গেছে এবং ডেটাবেজে সংরক্ষিত হয়েছে।",
      "success"
    );

  } catch (error) {
    if (error.name === "AbortError") return;

    if (currentLookup !== lookupNumber) return;

    playerNameInput.value = "";

    setLookupStatus(
      error.message === "Failed to fetch"
        ? "সার্ভারের সঙ্গে সংযোগ করা যাচ্ছে না।"
        : error.message || "Player Name পাওয়া যায়নি।",
      "error"
    );

  } finally {
    if (currentLookup === lookupNumber) {
      lookupController = null;
    }
  }
}

async function placeOrder() {
  const uid = uidInput.value.trim();
  const playerName = playerNameInput.value.trim();

  const result = document.getElementById("result");
  const button = document.getElementById("orderButton");

  if (!selectedPackage) {
    alert("আগে একটি Diamond Package বেছে নাও!");
    return;
  }

  if (!/^\d{5,15}$/.test(uid)) {
    alert("সঠিক Demo Player UID লিখো!");
    return;
  }

  button.disabled = true;
  button.textContent = "অর্ডার পাঠানো হচ্ছে...";

  result.style.display = "block";
  result.textContent = "ডেমো অর্ডার সংরক্ষণ করা হচ্ছে...";

  try {
    const response = await fetch("/api/orders", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        uid: uid,
        name: playerName,
        amount: String(selectedPackage)
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "অর্ডার সংরক্ষণ হয়নি");
    }

    result.textContent =
      "✅ Demo Order ডেটাবেজে সংরক্ষিত হয়েছে। " +
      (playerName
        ? "Player Name: " + playerName + "। "
        : "Player Name এখনো পাওয়া যায়নি। ") +
      "এটি আসল Payment বা Diamond Delivery নয়।";

  } catch (error) {
    result.textContent =
      "❌ অর্ডার সংরক্ষণ হয়নি। সার্ভার বা ডেটাবেজ সংযোগ পরীক্ষা করতে হবে।";

  } finally {
    button.disabled = false;
    button.textContent = "ডেমো অর্ডার তৈরি করো";
  }
}
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZRX TOPUP</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101020;
  color: white;
  text-align: center;
}
header {
  background: #191933;
  padding: 22px;
  color: #a78bfa;
  font-size: 27px;
  font-weight: bold;
}
.container {
  max-width: 500px;
  margin: 25px auto;
  padding: 15px;
}
.card {
  background: #20203b;
  padding: 18px;
  margin: 12px 0;
  border-radius: 12px;
}
button {
  background: #7c3aed;
  color: white;
  border: 0;
  padding: 12px 25px;
  border-radius: 8px;
  font-size: 16px;
}
input {
  width: 90%;
  padding: 13px;
  margin: 10px;
  border-radius: 8px;
  border: 0;
}
</style>
</head>
<body>
<header>ZRX TOPUP</header>
<div class="container">
<h2>Free Fire Diamond Store</h2>
<p>তোমার পছন্দের Diamond Package বেছে নাও</p>
<input id="uid" placeholder="Free Fire Player UID">
<h3>Diamond Packages</h3>
<div id="products">প্যাকেজ লোড হচ্ছে...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBPwH2ziVSVtdJnKhBu00WA3gw5LrHF56w",
  authDomain: "zrx-topup.firebaseapp.com",
  projectId: "zrx-topup",
  storageBucket: "zrx-topup.firebasestorage.app",
  messagingSenderId: "249302104733",
  appId: "1:249302104733:web:a5f3b2b07aa97b0601f274",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collection("products").get().then(snapshot => {
  const area = document.getElementById("products");
  area.innerHTML = "";

  snapshot.forEach(doc => {
    const p = doc.data();
    area.innerHTML += `
      <div class="card">
        <h3>${p.name || doc.id}</h3>
        <p>৳${p.price}</p>
        <button onclick="selectPackage('${doc.id}')">
          Select Package
        </button>
      </div>
    `;
  });
}).catch(error => { console.error("Firebase Error:", error);
  document.getElementById("products").innerText =
    "Firebase Error: " + error.code + " - " + error.message;
});
function selectPackage(id) {
  const uid = document.getElementById("uid").value.trim();
  if (!uid) {
    alert("প্রথমে Player UID লেখো");
    return;
  }
  alert("Package selected: " + id);
}
</script>
</body>
</html>
